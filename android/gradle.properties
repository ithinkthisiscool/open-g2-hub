# Memory caps: the Flutter template default (-Xmx8G + 4G metaspace) OOM-killed the 15 GB dev machine
# when two builds overlapped. 3 GB heap is enough for this app's release build (incl. R8).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.workers.max=2
# Don't let idle build daemons hold memory for hours.
org.gradle.daemon.idletimeout=600000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
